[manifest]
version = "1.0.0"
dump_lua = true
priority = 1

    # Ice Cream
[[patches]]
[patches.pattern]
target = "card.lua"
pattern = "if self.ability.extra.chips - self.ability.extra.chip_mod <= 0 then "
position = "at"
payload = '''if self.ability.extra.chips - self.ability.extra.chip_mod <= 0 then 
    G.GAME.pool_flags.ice_cream_eaten = true
    check_for_unlock({type = 'upgradedfood_destroy_joker'})'''
match_indent = true
times = 1

