    # Cavendish
[[patches]]
[patches.pattern]
target = "card.lua"
pattern = "if self.ability.name == 'Gros Michel' then G.GAME.pool_flags.gros_michel_extinct = true end"
position = "at"
payload = '''
if self.ability.name == 'Gros Michel' then G.GAME.pool_flags.gros_michel_extinct = true
elseif self.ability.name == 'Cavendish' then G.GAME.pool_flags.cavendish_extinct = true check_for_unlock({type = 'upgradedfood_destroy_joker'}) end'''
match_indent = true
times = 1
